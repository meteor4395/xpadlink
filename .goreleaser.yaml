version: 2
project_name: xpadlink

builds:
  - id: xpadlinkd
    dir: server
    main: ./cmd/xpadlinkd
    binary: xpadlinkd
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags: [-s -w]

release:
  extra_files:
    - glob: release-assets/xpadlinkd-windows-amd64.exe
    - glob: release-assets/ViGEmClient.dll
    - glob: release-assets/ViGEmClient-LICENSE.txt

archives:
  - id: xpadlinkd
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "xpadlinkd-{{ .Os }}-{{ .Arch }}"
    files:
      - README.md
      - src: 99-xpadlink-uinput.rules
        strip_parent: true
      - src: release-assets/ViGEmClient-LICENSE.txt
        strip_parent: true

checksum:
  name_template: SHA256SUMS

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge"
      - "^README"
